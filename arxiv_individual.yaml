      summary: We construct a smash product operation on secondary homotopy groups
        yielding the structure of a lax symmetric monoidal functor. Applications on
        cup-one products, Toda brackets and Whitehead products are considered. In
        particular we prove a formula for the crossed effect of the cup-one product
        operation on unstable homotopy groups of spheres which was claimed by Barratt-Jones-Mahowald.
      summary_detail: !!python/object/new:feedparser.util.FeedParserDict
