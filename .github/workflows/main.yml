name: build site

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo content
        uses: actions/checkout@v4 # checkout the repository content
        with:
          submodules: true
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' #install the python version needed    
      - name: Install dependencies
        run:
#          python -m pip install --upgrade pip
          pip install -r requirements.txt    
      - name: get bibliography
        run: |
          script=$(find . -path '*/.git/*' -prune -o -name bibliographer.py -print | head -n1)
          if [ -z "$script" ]; then
            echo "bibliographer.py not found"
            exit 1
          fi
          cd "$(dirname "$script")"
          python bibliographer.py
          cp output.yaml "$GITHUB_WORKSPACE/output.yaml"
      - name: populate
        run:
          python populate.py
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm install
      - name: build nmp
        run: npm run build --if-present
      - name: get output in the repo
        uses: stefanzweifel/git-auto-commit-action@v5
      - name: Install OpenVPN
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn
      - name: Create EduVPN configuration
        env:
          EDUVPN_CONFIG: ${{ secrets.EDUVPN_CONFIG }}
        run: |
          printf '%s\n' "$EDUVPN_CONFIG" > eduvpn.ovpn
      - name: Create OpenVPN credentials
        env:
          EDUVPN_USERNAME: ${{ secrets.EDUVPN_USERNAME }}
          EDUVPN_PASSWORD: ${{ secrets.EDUVPN_PASSWORD }}
        run: |
          printf '%s\n%s\n' "$EDUVPN_USERNAME" "$EDUVPN_PASSWORD" > up.txt
          chmod 600 up.txt
      - name: Connect to EduVPN
        run: |
          LOG="$RUNNER_TEMP/openvpn.log"
          PID="$RUNNER_TEMP/openvpn.pid"
          sudo openvpn \
            --config "$PWD/eduvpn.ovpn" \
            --auth-user-pass "$PWD/up.txt" \
            --daemon \
            --log "$LOG" \
            --writepid "$PID"
          for i in {1..30}; do
            if sudo grep -q "Initialization Sequence Completed" "$LOG"; then
              echo "EduVPN connection established."
              exit 0
            fi
            if sudo grep -q "AUTH_FAILED" "$LOG"; then
              echo "EduVPN authentication failed."
              sudo cat "$LOG"
              exit 1
            fi
            sleep 1
          done
          echo "EduVPN connection was not established."
          sudo cat "$LOG"
          exit 1
      - name: Deploy to my domain
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT }}
          local_path: './docs/*'
          remote_path: '/fmuro'
          sftp_only: true
          password: ${{ secrets.FTP_PASSWORD }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
          
# Deployment job to GutHub Pages
  deploy:
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
