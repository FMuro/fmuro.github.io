      title: Massey products for algebras over operads
      title_detail: !!python/object/new:feedparser.util.FeedParserDict
        dictitems:
          type: text/plain
          language: null
          base: https://arxiv.org/a/0000-0001-8457-9889.atom2
          value: Massey products for algebras over operads
      summary: We define a generalization of Massey products for algebras over a Koszul
        operad in characteristic zero, extending Massey's and Allday's and Retah's
        in the associative and Lie cases, respectively. We establish connections with
        minimal models and with Dimitrova's universal operadic cohomology class. We
        compute a Gerstenhaber algebra example and a hypercommutative algebra example
        related to the Chevalley-Eilenberg complex of the Heisenberg Lie algebra.
