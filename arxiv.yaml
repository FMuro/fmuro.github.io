      title: Triangulated categories without models
      title_detail: !!python/object/new:feedparser.util.FeedParserDict
        dictitems:
          type: text/plain
          language: null
          base: https://arxiv.org/a/0000-0001-8457-9889.atom2
          value: Triangulated categories without models
      summary: We exhibit examples of triangulated categories which are neither the
        stable category of a Frobenius category nor a full triangulated subcategory
        of the homotopy category of a stable model category. Even more drastically,
        our examples do not admit any non-trivial exact functors to or from these
        algebraic respectively topological triangulated categories.
