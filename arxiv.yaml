      title: On the functoriality of cohomology of categories
      title_detail: !!python/object/new:feedparser.util.FeedParserDict
        dictitems:
          type: text/plain
          language: null
          base: https://arxiv.org/a/0000-0001-8457-9889.atom2
          value: On the functoriality of cohomology of categories
      summary: In this paper we show that the Baues-Wirsching complex used to define
        cohomology of categories is a 2-functor from a certain 2-category of natural
        systems of abelian groups to the 2-category of chain complexes, chain homomorphism
        and relative homotopy classes of chain homotopies. As a consequence we derive
        (co)localization theorems for this cohomology.
      summary_detail: !!python/object/new:feedparser.util.FeedParserDict
