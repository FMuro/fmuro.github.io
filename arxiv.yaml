          base: https://arxiv.org/a/0000-0001-8457-9889.atom2
          value: 'Minimal ${A}_{\infty}$-algebras of endomorphisms: The case of $d\mathbb{Z}$-cluster
            tilting objects'
      summary: The Derived Auslander--Iyama Corresponence, a recent result of the
        authors, provides a classification up to quasi-isomorphism of the derived
        endomorphism algebras of basic $d\mathbb{Z}$-cluster tilting objects in $\operatorname{Hom}$-finite
        algebraic triangulated categories in terms of a small amount of algebraic
        data. In this note we highlight the role of minimal $A_\infty$-algebra structures
        in the proof of this result, as well as the crucial role of the enhanced $A_\infty$-obstruction
        theory developed by the second-named author.
