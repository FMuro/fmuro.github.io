      title: Homotopy units in A-infinity algebras
      title_detail: !!python/object/new:feedparser.util.FeedParserDict
        dictitems:
          type: text/plain
          language: null
          base: https://arxiv.org/a/0000-0001-8457-9889.atom2
          value: Homotopy units in A-infinity algebras
      summary: We show that the canonical map from the associative operad to the unital
        associative operad is a homotopy epimorphism for a wide class of symmetric
        monoidal model categories. As a consequence, the space of unital associative
        algebra structures on a given object is up to homotopy a subset of connected
        components of the space of non-unital associative algebra structures.
