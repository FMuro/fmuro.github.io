      title: Cylinders for non-symmetric DG-operads via homological perturbation theory
      title_detail: !!python/object/new:feedparser.util.FeedParserDict
        dictitems:
          type: text/plain
          language: null
          base: https://arxiv.org/a/0000-0001-8457-9889.atom2
          value: Cylinders for non-symmetric DG-operads via homological perturbation
            theory
      summary: We construct small cylinders for cellular non-symmetric DG-operads
        over an arbitrary commutative ring by using the basic perturbation lemma from
        homological algebra. We show that our construction, applied to the A-infinity
        operad, yields the operad parametrizing A-infinity maps whose linear part
        is the identity. We also compute some other examples with non-trivial operations
        in arities 1 and 0.
