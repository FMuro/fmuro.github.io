      title: Representation theory of some infinite-dimensional algebras arising in
        continuously controlled algebra and topology
      title_detail: !!python/object/new:feedparser.util.FeedParserDict
        dictitems:
          type: text/plain
          language: null
          base: https://arxiv.org/a/0000-0001-8457-9889.atom2
          value: Representation theory of some infinite-dimensional algebras arising
            in continuously controlled algebra and topology
      summary: In this paper we determine the representation type of some algebras
        of infinite matrices continuously controlled at infinity by a compact metrizable
        space. We explicitly classify their finitely presented modules in the finite
        and tame cases. The algebra of row-column-finite (or locally finite) matrices
        over an arbitrary field is one of the algebras considered in this paper, its
        representation type is shown to be finite.
