      title: A model structure for locally constant factorization algebras
      title_detail: !!python/object/new:feedparser.util.FeedParserDict
        dictitems:
          type: text/plain
          language: null
          base: https://arxiv.org/a/0000-0001-8457-9889.atom2
          value: A model structure for locally constant factorization algebras
      summary: Several model structures related to the homotopy theory of locally
        constant factorization algebras are constructed. This answers a question raised
        by D. Calaque in his habilitation thesis. Our methods also solve a problem
        related to cosheafification and factorization algebras identified by O. Gwilliam
        - K. Rejzner in the locally constant case.
