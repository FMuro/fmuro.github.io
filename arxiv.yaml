      title: The algebra of secondary homotopy operations in ring spectra
      title_detail: !!python/object/new:feedparser.util.FeedParserDict
        dictitems:
          type: text/plain
          language: null
          base: https://arxiv.org/a/0000-0001-8457-9889.atom2
          value: The algebra of secondary homotopy operations in ring spectra
      summary: The primary algebraic model of a ring spectrum is the ring of homotopy
        groups. We introduce the secondary model which has the structure of a secondary
        analogue of a ring. This new algebraic model determines Massey products and
        cup-one squares. As an application we obtain new derivations of the homotopy
        ring.
