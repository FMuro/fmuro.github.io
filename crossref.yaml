  abstract: <jats:title>Abstract</jats:title><jats:p>We introduce cohomologically
    triangulated categories as triples (<jats:bold>A</jats:bold>,<jats:italic>t</jats:italic>,▽)
    given by an additive category<jats:bold>A</jats:bold>, an additive equivalence<jats:italic>t</jats:italic>:<jats:bold>A</jats:bold><jats:inline-graphic
    xmlns:xlink="http://www.w3.org/1999/xlink" mime-subtype="gif" mimetype="image"
    xlink:type="simple" xlink:href="S1755069607000199inline1" /><jats:bold>A</jats:bold>and
    a cohomology class ▽ in the translation cohomology<jats:italic>H</jats:italic><jats:sub>3</jats:sub>(<jats:bold>A</jats:bold>,<jats:italic>t</jats:italic>).
    A stable homotopy theory<jats:bold>C</jats:bold>with<jats:bold>A</jats:bold>=
    Ho<jats:bold>C</jats:bold>yields such a triple and the class of distinguished
    triangles in<jats:bold>A</jats:bold>is deduced from ▽.</jats:p>
