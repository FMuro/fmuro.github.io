  abstract: <jats:title>Abstract</jats:title><jats:p>A cohomologically triangulated
    category is an additive category<jats:bold>A</jats:bold>together with a translation
    functor<jats:italic>t</jats:italic>and a cohomology class Δ ∈<jats:italic>H</jats:italic><jats:sup>3</jats:sup>(<jats:bold>A</jats:bold>,<jats:italic>t</jats:italic>)
    such that any good translation track category representing Δ is a triangulated
    track category. In this paper we give purely cohomological conditions on Δ which
    imply that (<jats:bold>A</jats:bold>,<jats:italic>t</jats:italic>,Δ) is a cohomologically
    triangulated category, avoiding the use of track categories. This yields a purely
    cohomological characterization of triangulated cohomology classes.</jats:p>
