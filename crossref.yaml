  abstract: "<jats:title>Abstract</jats:title>\n                  <jats:p>\n     \
    \               We prove that the (homotopy) hypercommutative algebra structure\
    \ on the de Rham cohomology of a Poisson or Jacobi manifold defined by several\
    \ authors is (homotopically) trivial, i.e. it reduces to the underlying (homotopy)\
    \ commutative algebra structure. We do so by showing that the DG operads which\
    \ codify the algebraic structure on the de Rham complex of Poisson and Jacobi\
    \ manifolds, generated by the exterior product and the interior products with\
    \ the structure polyvector fields, are quasi-isomorphic to the commutative suboperad.\
    \ We proceed similarly with the commutative\n                    <jats:inline-formula>\n\
    \                      <jats:alternatives>\n                        <jats:tex-math>$$BV_\\\
    infty $$</jats:tex-math>\n                        <mml:math xmlns:mml=\"http://www.w3.org/1998/Math/MathML\"\
    >\n                          <mml:mrow>\n                            <mml:mi>B</mml:mi>\n\
    \                            <mml:msub>\n                              <mml:mi>V</mml:mi>\n\
    \                              <mml:mi>∞</mml:mi>\n                          \
    \  </mml:msub>\n                          </mml:mrow>\n                      \
    \  </mml:math>\n                      </jats:alternatives>\n                 \
    \   </jats:inline-formula>\n                    -algebra structure on the de Rham\
    \ complex of a generalized Poisson supermanifold.\n                  </jats:p>"
