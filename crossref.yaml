  abstract: <p>Crossed and quadratic modules are algebraic models of the 2-type and
    the 3-type of a space, respectively. In this paper we compute a purely algebraic
    suspension functor from crossed to quadratic modules which sends a 2-type to the
    3-type of its suspension. We also give some applications in homotopy theory and
    group theory.</p>
