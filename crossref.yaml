  abstract: <jats:p>We develop a theory of minimal models for algebras over a Koszul
    operad with trivial differential defined over a commutative ring (containing <jats:inline-formula><jats:alternatives><jats:tex-math>$\mathbb
    {Q}$</jats:tex-math><jats:inline-graphic xmlns:xlink="http://www.w3.org/1999/xlink"
    mime-subtype="png" xlink:href="S0308210522000427_inline1.png"/></jats:alternatives></jats:inline-formula>
    in the symmetric case), not necessarily a field, extending and supplementing the
    work of Sagave for the associative case. Our minimal models are bigraded and contain
    a projective resolution of the homology.</jats:p>
