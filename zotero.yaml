    abstractNote: We provide an outline of the proof of the Donovan--Wemyss Conjecture
      in the context of the Homological Minimal Model Program for threefolds. The
      proof relies on results of August, of Hua and the second-named author, Wemyss,
      and on the Triangulated Auslander--Iyama Correspondence -- a recent result by
      the first- and third-named authors.
