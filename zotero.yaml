    key: 3KNJVHK2
    version: 58175
    itemType: journalArticle
    title: Enhanced ${A}_{\infty}$-obstruction theory
    creators:
    - creatorType: author
      firstName: Fernando
      lastName: Muro
    abstractNote: An 𝐴𝑛AnA_n-algebra 𝐴=(𝐴,𝑚1,𝑚2,…,𝑚𝑛)A=(A,m1,m2,…,mn)A= (A,m_1, m_2,
      \ldots , m_n) is a special kind of 𝐴∞A∞A_\infty -algebra satisfying the 𝐴∞A∞A_\infty
      -relations involving just the 𝑚𝑖mim_i listed. We consider obstructions to extending
      an 𝐴𝑛−1An−1A_{n-1} algebra to an 𝐴𝑛AnA_n-algebra. We enhance the known techniques
      by extending the Bousfield–Kan spectral sequence to apply to the homotopy groups
      of the space of minimal (i.e. 𝑚1=0)m1=0)m_1=0)𝐴∞A∞A_\infty -algebra structures
      on a given graded projective module. We also consider the Bousfield–Kan spectral
      sequence for the moduli space of 𝐴∞A∞A_\infty -algebras. We compute up to the
      𝐸2E2E_2 terms and differentials 𝑑2d2d_2 of these spectral sequences in terms
      of Hochschild cohomology.
