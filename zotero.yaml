    title: Massey products for algebras over operads
    creators:
    - creatorType: author
      firstName: Fernando
      lastName: Muro
    abstractNote: We define a generalization of Massey products for algebras over
      a Koszul operad in characteristic zero, extending Massey’s and Allday’s and
      Retah’s in the associative and Lie cases, respectively. We establish connections
      with minimal models and with Dimitrova’s universal operadic cohomology class.
      We compute a Gerstenhaber algebra example and a hypercommutative algebra example
      related to the Chevalley–Eilenberg complex of the Heisenberg Lie algebra.
