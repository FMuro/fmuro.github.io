    abstractNote: We develop a theory of minimal models for algebras over a Koszul
      operad with trivial differential defined over a commutative ring (containing
      QQ\mathbb {Q} in the symmetric case), not necessarily a field, extending and
      supplementing the work of Sagave for the associative case. Our minimal models
      are bigraded and contain a projective resolution of the homology.
